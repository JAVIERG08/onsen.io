<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>App móvil con Onsen UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/onsenui/css/onsenui.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/onsenui/css/onsen-css-components.min.css">
  <script src="https://cdn.jsdelivr.net/npm/onsenui/js/onsenui.min.js"></script>
</head>
<body>

  <!-- Navegador de páginas -->
  <ons-navigator id="myNavigator" page="home.html"></ons-navigator>

  <!-- Página principal -->
  <template id="home.html">
    <ons-page>
      <ons-toolbar>
        <div class="center">Inicio</div>
      </ons-toolbar>

      <div style="text-align: center; margin-top: 40px;">
        <ons-button onclick="fn.pushPage('about.html')">Ir a Sobre Nosotros</ons-button>
      </div>
    </ons-page>
  </template>

  <!-- Página secundaria -->
  <template id="about.html">
    <ons-page>
      <ons-toolbar>
        <div class="left"><ons-back-button>Atrás</ons-back-button></div>
        <div class="center">Sobre Nosotros</div>
      </ons-toolbar>

      <div style="padding: 20px;">
        <p>Esta es una app de navegación hecha con Onsen UI.</p>
      </div>
    </ons-page>
  </template>

  <script>
    window.fn = {};
    fn.pushPage = function(page) {
      document.getElementById('myNavigator').pushPage(page);
    };
  </script>

</body>
</html>
